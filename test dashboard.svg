<svg width="800" height="800" viewBox="0 0 800 800" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <style>
      .center-title { font-family: sans-serif; font-size: 24px; font-weight: bold; fill: #333; text-anchor: middle; }
      .center-subtitle { font-family: sans-serif; font-size: 16px; fill: #555; text-anchor: middle; }
      .segment-title { font-family: sans-serif; font-size: 18px; font-weight: bold; fill: white; text-anchor: middle; }
      .segment-text { font-family: sans-serif; font-size: 12px; fill: white; text-anchor: start; }
      .icon { fill: white; }
    </style>
  </defs>

  <circle cx="400" cy="400" r="120" fill="#E0F2F7"/> <text x="400" y="385" class="center-title">THEMATIC DASHBOARD</text>
  <text x="400" y="410" class="center-subtitle">ARCHITECTURE, SEMANTICS, AND COMPLEXITY</text>
  <text x="400" y="430" class="center-subtitle">Navigation Map of Work</text>

  <g id="segment-colors">
    <linearGradient id="eaGradient" x1="0%" y1="0%" x2="100%" y2="100%"> <stop offset="0%" style="stop-color:#3498DB"/> <stop offset="100%" style="stop-color:#21618C"/> </linearGradient>
    <linearGradient id="plmGradient" x1="0%" y1="0%" x2="100%" y2="100%"> <stop offset="0%" style="stop-color:#2ECC71"/> <stop offset="100%" style="stop-color:#1E8449"/> </linearGradient>
    <linearGradient id="personalGradient" x1="0%" y1="0%" x2="100%" y2="100%"> <stop offset="0%" style="stop-color:#9B59B6"/> <stop offset="100%" style="stop-color:#6C3483"/> </linearGradient>
    <linearGradient id="visGradient" x1="0%" y1="0%" x2="100%" y2="100%"> <stop offset="0%" style="stop-color:#F1C40F"/> <stop offset="100%" style="stop-color:#B7950B"/> </linearGradient>
    <linearGradient id="compGradient" x1="0%" y1="0%" x2="100%" y2="100%"> <stop offset="0%" style="stop-color:#E67E22"/> <stop offset="100%" style="stop-color:#AF601A"/> </linearGradient>
    <linearGradient id="aiGradient" x1="0%" y1="0%" x2="100%" y2="100%"> <stop offset="0%" style="stop-color:#E74C3C"/> <stop offset="100%" style="stop-color:#C0392B"/> </linearGradient>
    <linearGradient id="ontGradient" x1="0%" y1="0%" x2="100%" y2="100%"> <stop offset="0%" style="stop-color:#1ABC9C"/> <stop offset="100%" style="stop-color:#117A65"/> </linearGradient>
  </g>

  <g transform="translate(0,0)"> <path d="M400,400 L550,150 A200,200 0 0,1 650,250 L400,400 Z" fill="url(#eaGradient)"/> <text x="500" y="200" class="segment-title" text-anchor="middle">Enterprise Architecture & Modeling</text>
    <text x="420" y="230" class="segment-text">Motivation: Oversimplification of EA risks losing critical enterprise dynamics.</text>
    <text x="420" y="250" class="segment-text">Core Message: Modeling languages must balance expressive richness and usability.</text>
    <text x="420" y="270" class="segment-text">Key Insight: Multi-layer modeling supports operational interoperability.</text>
    <path d="M..." class="icon"/>
  </g>

  <g>
    <text x="500" y="400" class="segment-title" text-anchor="middle">PLM, Standards & Interoperability</text>
    <text x="420" y="430" class="segment-text">Motivation: Standards underused, misalignment causes inefficiency.</text>
    <text x="420" y="450" class="segment-text">Core Message: Effective use of standards ensures continuous interoperability.</text>
    <text x="420" y="470" class="segment-text">Key Insight: Standards provide a shared operational foundation.</text>
  </g>

  <g>
    <text x="400" y="600" class="segment-title" text-anchor="middle">Personal Journeys & Reflections</text>
    <text x="320" y="630" class="segment-text">Motivation: Technical work must remain human-centered.</text>
    <text x="320" y="650" class="segment-text">Core Message: Narrative and reflection foster collective understanding.</text>
    <text x="320" y="670" class="segment-text">Key Insight: Humanized storytelling strengthens engagement and learning.</text>
  </g>

  <g>
    <text x="200" y="600" class="segment-title" text-anchor="middle">Visualization & Semantic Cartography</text>
    <text x="120" y="630" class="segment-text">Motivation: Traditional diagrams insufficient for complex systems.</text>
    <text x="120" y="650" class="segment-text">Core Message: Interactive visualizations and semantic cartography make complexity actionable.</text>
    <text x="120" y="670" class="segment-text">Key Insight: Visual grammar bridges models and human understanding.</text>
  </g>

  <g>
    <text x="150" y="400" class="segment-title" text-anchor="middle">Complexity & Philosophy</text>
    <text x="70" y="430" class="segment-text">Motivation: Flat models fail to represent holonic nature of systems.</text>
    <text x="70" y="450" class="segment-text">Core Message: Multi-scale, hierarchical representation is essential.</text>
    <text x="70" y="470" class="segment-text">Key Insight: Respecting system composition prevents misinterpretation.</text>
  </g>

  <g>
    <text x="200" y="200" class="segment-title" text-anchor="middle">AI & Emerging Technologies</text>
    <text x="120" y="230" class="segment-text">Motivation: Hype-driven adoption can mislead enterprises.</text>
    <text x="120" y="250" class="segment-text">Core Message: AI is a tool, not a replacement; requires semantic grounding.</text>
    <text x="120" y="270" class="segment-text">Key Insight: Semantic grounding ensures reliable integration and trust.</text>
  </g>

  <g>
    <text x="400" y="150" class="segment-title" text-anchor="middle">Ontologies & Knowledge Representation</text>
    <text x="320" y="180" class="segment-text">Motivation: Ontologies often misapplied; false precision.</text>
    <text x="320" y="200" class="segment-text">Core Message: Semantic models must reflect context and epistemology.</text>
    <text x="320" y="220" class="segment-text">Key Insight: Modular, context-aware ontologies prevent aggregation errors.</text>
  </g>

  <rect x="50" y="750" width="10" height="10" fill="#3498DB"/>
  <text x="70" y="760" class="segment-text" fill="#333">EA / PLM (Structural)</text>
  </svg>